<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Topology Dojo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Vendored legacy renderer + theme (loaded as classic scripts; expose window.TopologyDesigner) -->
    <link rel="stylesheet" href="/vendor/topology-ds.css" />
    <script src="/vendor/graph.js"></script>
    <script src="/vendor/topology-ds.js"></script>
    <style>
      :root {
        --bg: #1d1f27;
        --panel: #22252e;
        --panel2: #292d3a;
        --border: #3e4550;
        --text: #e6e8e9;
        --muted: #7d8a92;
        --accent: #01a982;
        --font: 'JetBrains Mono', ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .bar-actions .hint {
        color: var(--muted);
        font-size: 11px;
      }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: 0;
      }
      .stage .tds-root,
      .stage .tds-canvas-row,
      .stage .tds-canvas {
        height: 100%;
      }
      #page-canvas {
        width: 100%;
        height: 100%;
      }

      .filmstrip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        overflow-x: auto;
      }
      .frame {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
        font-family: var(--font);
      }
      .frame.on {
        border-color: var(--accent);
        background: rgba(1, 169, 130, 0.14);
        box-shadow: 0 0 0 1px rgba(1, 169, 130, 0.3);
      }
      .frame-n {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--border);
        font-size: 11px;
        font-weight: 700;
      }
      .frame.on .frame-n {
        background: var(--accent);
        color: var(--bg);
      }
      .frame.add {
        color: var(--muted);
        border-style: dashed;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
