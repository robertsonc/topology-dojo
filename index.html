<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Topology Dojo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Vendored legacy renderer + theme (loaded as classic scripts; expose window.TopologyDesigner) -->
    <link rel="stylesheet" href="/vendor/topology-ds.css" />
    <script src="/vendor/graph.js"></script>
    <script src="/vendor/topology-ds.js"></script>
    <style>
      :root {
        --bg: #1d1f27;
        --panel: #22252e;
        --panel2: #292d3a;
        --border: #3e4550;
        --text: #e6e8e9;
        --muted: #7d8a92;
        --accent: #01a982;
        --font: 'JetBrains Mono', ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .bar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bar-actions .hint {
        color: var(--muted);
        font-size: 11px;
      }
      .tbtn {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 8px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font);
      }
      .tbtn.on {
        color: var(--accent);
        border-color: rgba(1, 169, 130, 0.5);
        background: rgba(1, 169, 130, 0.12);
      }
      .tbtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .align-group {
        display: inline-flex;
        gap: 3px;
        padding-left: 8px;
        margin-left: 4px;
        border-left: 1px solid var(--border);
      }
      .align-group[hidden] {
        display: none;
      }
      .ab {
        padding: 5px 8px;
      }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: 0;
      }
      .palette {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 6;
        width: 132px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: rgba(34, 37, 46, 0.92);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .palette-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 2px 4px 4px;
      }
      .pitem {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 6px 9px;
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font);
        text-align: left;
      }
      .pitem:hover {
        border-color: rgba(1, 169, 130, 0.5);
        color: var(--accent);
      }

      .inspector {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 6;
        width: 220px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: rgba(34, 37, 46, 0.94);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .inspector[hidden] {
        display: none;
      }
      .insp-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .insp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .insp-row.col {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .insp-row input,
      .insp-row select {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
      }
      .insp-row .hex {
        flex: none;
        width: 100%;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 4px;
      }
      .sw {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      .sw.on {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .stage .tds-root,
      .stage .tds-canvas-row,
      .stage .canvas-host {
        height: 100%;
        width: 100%;
      }
      /* The legacy .tds-canvas-row is a flexbox (it expected a sidebar); make it
         a plain block so the canvas fills the stage instead of collapsing. */
      .stage .tds-canvas-row {
        display: block;
      }
      .canvas-host {
        position: relative;
        /* Flatten the legacy canvas's 3D tilt so SVG getScreenCTM() maps
           cursor → user-space exactly (drag/hit-testing depend on it). */
        transform: none !important;
        perspective: none !important;
      }
      #page-canvas,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #overlay {
        cursor: default;
        touch-action: none;
      }

      .filmstrip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        overflow-x: auto;
      }
      .frame {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
        font-family: var(--font);
      }
      .frame.on {
        border-color: var(--accent);
        background: rgba(1, 169, 130, 0.14);
        box-shadow: 0 0 0 1px rgba(1, 169, 130, 0.3);
      }
      .frame-n {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--border);
        font-size: 11px;
        font-weight: 700;
      }
      .frame.on .frame-n {
        background: var(--accent);
        color: var(--bg);
      }
      .frame.add {
        color: var(--muted);
        border-style: dashed;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
