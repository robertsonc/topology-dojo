<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Topology Dojo</title>
    <style>
      :root {
        --bg: #070b12;
        --panel: #0d1420;
        --border: #1c2738;
        --bright: #e8eef7;
        --muted: #8893a8;
        --accent: #05cc93;
        --blue: #4aa3ff;
        --violet: #9b8cff;
        --red: #fc6161;
        --font:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--bright);
        font-family: var(--font);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 1fr auto;
        height: 100vh;
      }

      .bar {
        grid-column: 1/3;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
      }
      .brand {
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .proto {
        font-weight: 400;
        color: var(--muted);
        font-size: 11px;
        margin-left: 8px;
      }
      .modes button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 12px;
        margin-left: 6px;
      }
      .modes button.on {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
      }

      .stage {
        position: relative;
        grid-row: 2;
        grid-column: 1;
        overflow: hidden;
      }
      .canvas,
      .canvas svg {
        width: 100%;
        height: 100%;
      }

      .panel {
        grid-row: 2;
        grid-column: 2;
        width: 340px;
        background: var(--panel);
        border-left: 1px solid var(--border);
        padding: 14px;
        overflow-y: auto;
        font-size: 12px;
      }
      .panel-h {
        font-weight: 700;
        margin-bottom: 10px;
        font-size: 13px;
      }
      .panel-h input {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--bright);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 13px;
        width: 180px;
        font-family: var(--font);
      }
      #beatNote {
        width: 100%;
        min-height: 56px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--bright);
        border-radius: 6px;
        padding: 8px;
        font-size: 11px;
        font-family: var(--font);
        resize: vertical;
        margin-bottom: 12px;
      }
      table.ov {
        width: 100%;
        border-collapse: collapse;
      }
      table.ov th {
        text-align: left;
        color: var(--muted);
        font-weight: 500;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 4px;
        border-bottom: 1px solid var(--border);
      }
      table.ov td {
        padding: 5px 4px;
        border-bottom: 1px solid rgba(28, 39, 56, 0.5);
      }
      td.el b {
        display: block;
      }
      td.el .kind {
        color: var(--muted);
        font-size: 10px;
      }
      .chip {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 3px 9px;
        cursor: pointer;
        font-size: 11px;
        width: 100%;
      }
      .chip.on {
        color: var(--accent);
        border-color: rgba(5, 204, 147, 0.5);
        background: rgba(5, 204, 147, 0.1);
      }
      .chip.focus {
        color: var(--accent);
        border-color: rgba(5, 204, 147, 0.5);
        background: rgba(5, 204, 147, 0.12);
      }
      .chip.dim {
        color: var(--muted);
        border-color: rgba(136, 147, 168, 0.4);
        background: rgba(136, 147, 168, 0.08);
      }
      .muted {
        color: var(--muted);
      }
      .problems {
        margin-top: 12px;
        padding: 10px;
        border: 1px solid rgba(252, 97, 97, 0.4);
        background: rgba(252, 97, 97, 0.08);
        border-radius: 8px;
        color: #ff9b9b;
        font-size: 11px;
        line-height: 1.5;
      }
      .ok {
        margin-top: 12px;
        padding: 8px 10px;
        border: 1px solid rgba(5, 204, 147, 0.3);
        background: rgba(5, 204, 147, 0.07);
        border-radius: 8px;
        color: var(--accent);
        font-size: 11px;
      }
      .hint {
        margin-top: 14px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.55;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }

      /* Canvas-first authoring affordances */
      .node {
        cursor: grab;
      }
      body.dragging,
      body.dragging .node {
        cursor: grabbing;
      }
      .decor {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .inline {
        position: absolute;
        z-index: 5;
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 5px;
        background: rgba(13, 20, 32, 0.96);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(6px);
        white-space: nowrap;
      }
      .inline .lbl {
        font-weight: 700;
        font-size: 11px;
        padding: 0 4px;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .inline .base-hint {
        color: var(--muted);
        font-size: 11px;
        padding: 0 4px;
      }
      .ictl {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
        font-size: 11px;
      }
      .ictl.on {
        color: var(--accent);
        border-color: rgba(5, 204, 147, 0.5);
        background: rgba(5, 204, 147, 0.12);
      }
      .ictl.off {
        color: var(--muted);
      }
      .ictl.clear {
        color: var(--muted);
        padding: 3px 6px;
      }
      .tip {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        margin-bottom: 10px;
      }
      .el-list {
        margin-bottom: 12px;
      }
      .elrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 7px;
        border-radius: 6px;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .elrow:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .elrow.sel {
        background: rgba(5, 204, 147, 0.12);
        border-color: rgba(5, 204, 147, 0.4);
      }
      .elrow .kind {
        color: var(--muted);
        font-size: 10px;
      }
      .elrow .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }

      .strip {
        grid-column: 1/3;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        overflow-x: auto;
      }
      .beat {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--bright);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
      }
      .beat.on {
        border-color: var(--accent);
        background: rgba(5, 204, 147, 0.12);
        box-shadow: 0 0 0 1px rgba(5, 204, 147, 0.3);
      }
      .beat .bi {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--border);
        font-size: 11px;
        font-weight: 700;
      }
      .beat.on .bi {
        background: var(--accent);
        color: var(--bg);
      }
      .beat.add {
        color: var(--muted);
        border-style: dashed;
      }
      .arrow {
        color: var(--muted);
        font-size: 14px;
      }

      .presenter-hint {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 11px;
        background: rgba(13, 20, 32, 0.7);
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        pointer-events: none;
      }
      .speaker {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: 680px;
        width: 80%;
        background: rgba(13, 20, 32, 0.92);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 22px;
        pointer-events: none;
        backdrop-filter: blur(8px);
      }
      .speaker-beat {
        color: var(--accent);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .speaker-note {
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
