<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Topology Dojo</title>
    <!-- JetBrains Mono is self-hosted via @fontsource (imported in main.ts) so
         the app renders identically offline / on Cloudflare with no external fetch. -->
    <!-- Vendored legacy renderer + theme. Loaded as classic scripts that expose
         window.TopologyDesigner; `defer` keeps the 300KB+ engine from blocking
         HTML parsing while still guaranteeing it runs (in order) before the
         deferred entry module that consumes it. -->
    <link rel="stylesheet" href="/vendor/topology-ds.css" />
    <script src="/vendor/core/graph.js" defer></script>
    <script src="/vendor/topology-ds.js" defer></script>
    <style>
      :root {
        --bg: #1d1f27;
        --panel: #22252e;
        --panel2: #292d3a;
        --border: #3e4550;
        --text: #e6e8e9;
        --muted: #7d8a92;
        --accent: #01a982;
        --font: 'JetBrains Mono', ui-monospace, monospace;
        /* Flat canvas fill — a single tone, no radial sheen/vignette. Shared by
           the live canvas and (as a matching literal) the exported SVG/PNG
           backdrop so live and exports read identically. */
        --canvas-bg: #0e1613;
        /* Glow budget: flat everywhere; the ONLY glow is the emphasis spotlight. */
        --glow-none: none;
        --glow-emphasis: drop-shadow(
          0 0 6px color-mix(in srgb, var(--accent) 50%, transparent)
        );
        /* Slim scrollbar thumb tints, derived from --accent (#01a982 = rgb 1 169 130).
           Kept as tokens so the scroll-slim rules never hardcode the color twice. */
        --sb-thumb: rgba(1, 169, 130, 0.25);
        --sb-thumb-hover: rgba(1, 169, 130, 0.55);
      }
      /* Light theme — overrides the chrome + canvas backdrop (engine node art
         keeps its own colors, which read fine on a light canvas). */
      :root.light {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel2: #eaeef2;
        --border: #cdd5dd;
        --text: #1d1f27;
        --muted: #5c6b76;
        /* Flat light canvas (no sheen/vignette). */
        --canvas-bg: #eef1f4;
        /* Slightly stronger tints so the green thumb stays legible on light panels. */
        --sb-thumb: rgba(1, 169, 130, 0.4);
        --sb-thumb-hover: rgba(1, 169, 130, 0.7);
      }
      * {
        box-sizing: border-box;
      }

      /* Shared keyboard-focus treatment (#210): one high-contrast ring for
         every interactive control — toolbar/canvas/frame buttons, swatches,
         menu items, inputs. :focus-visible keeps mouse clicks quiet. --accent
         reads on both themes' panel + canvas surfaces. Never reintroduce a
         bare `outline: none` without a visible replacement. */
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      a:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Visually hidden but exposed to assistive tech (aria-live region). */
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Root SVG defs sprite: present in the render tree but visually absent.
         Never use display:none here — it disables the paint servers that canvas
         nodes and palette previews reference by url(#…). */
      .svg-defs-sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        pointer-events: none;
      }

      /* Slim hover-reveal scrollbars — shared across editor chrome panels
         (palette, properties, dialogs, dropdowns, filmstrip). Applied via the
         .scroll-slim utility, never on the canvas viewport.

         Track is always transparent; the thumb is invisible at rest, appears
         when the pointer is over the scroll container, and tints stronger when
         hovering the thumb itself. The hit area is a full 8px but the visible
         pill is ~4px, via a 2px transparent border + padding-box background clip
         (a raw 4px scrollbar is too hard to grab). scrollbar-gutter: stable
         reserves the inline-end gutter so content doesn't shift on reveal.

         WARNING: scrollbar-width / scrollbar-color are declared ONLY inside the
         @supports (Firefox) block. Setting either standard property on the
         element disables ALL ::-webkit-scrollbar styling in Chromium 121+ — do
         not hoist them up here. No transitions: Chromium doesn't animate
         scrollbar pseudo-elements. */
      .scroll-slim {
        scrollbar-gutter: stable;
      }
      .scroll-slim::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .scroll-slim::-webkit-scrollbar-track {
        background: transparent;
      }
      .scroll-slim::-webkit-scrollbar-corner {
        background: transparent;
      }
      .scroll-slim::-webkit-scrollbar-thumb {
        background-color: transparent;
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .scroll-slim:hover::-webkit-scrollbar-thumb {
        background-color: var(--sb-thumb);
      }
      .scroll-slim:hover::-webkit-scrollbar-thumb:hover {
        background-color: var(--sb-thumb-hover);
      }
      @supports not selector(::-webkit-scrollbar) {
        .scroll-slim {
          scrollbar-width: thin;
          scrollbar-color: var(--sb-thumb) transparent;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        /* Constrain the single column so the wide legacy canvas can't blow out
           the grid past the viewport (keeps absolute UI like the minimap in view). */
        grid-template-columns: minmax(0, 1fr);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Status bar — live tool / cursor / counts / zoom readout. */
      .statusbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 4px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 11px;
        font-family: var(--font);
        white-space: nowrap;
        overflow-x: auto;
      }
      .statusbar .sb-k {
        color: var(--text);
      }
      .statusbar .sb-hint {
        margin-left: auto;
        color: var(--muted);
        opacity: 0.85;
      }
      /* Always-visible problems indicator; click opens the right-rail section. */
      .statusbar .sb-problems {
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 8px;
        line-height: 16px;
        cursor: pointer;
      }
      .statusbar .sb-problems:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .statusbar .sb-problems.has-warn {
        color: #e0a44a;
        border-color: #e0a44a;
      }
      .statusbar .sb-problems.has-error {
        color: #fc6161;
        border-color: #fc6161;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        overflow-x: auto;
        overflow-y: hidden;
      }
      .bar-left,
      .bar-right {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 3px;
      }
      .bar-right {
        justify-content: flex-end;
      }
      /* A cluster of related controls; dividers separate clusters. */
      .tgroup {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .bar-div {
        flex: none;
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 4px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-right: 2px;
        user-select: none;
      }
      .logo-mark {
        display: block;
        color: var(--accent);
        flex: none;
      }
      .wordmark {
        font-size: 13px;
        letter-spacing: 0.3px;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
      }
      .wordmark b {
        color: var(--text);
        font-weight: 700;
        margin-left: 2px;
      }
      .tlabel {
        margin-left: 5px;
      }
      /* Graceful degradation as the bar narrows: first collapse tool/action
         labels to their icons, then drop the wordmark text (logo stays). */
      @media (max-width: 1480px) {
        .tlabel {
          display: none;
        }
      }
      @media (max-width: 1360px) {
        .wordmark {
          display: none;
        }
      }
      /* Narrow viewports: let the toolbar wrap to rows instead of clipping, and
         shrink the floating panels so the canvas stays usable. */
      @media (max-width: 880px) {
        .bar {
          overflow-x: visible;
          flex-wrap: wrap;
          row-gap: 4px;
        }
        .bar-left,
        .bar-right {
          flex-wrap: wrap;
        }
      }
      @media (max-width: 700px) {
        .palette {
          width: 108px;
          padding: 8px;
        }
        .inspector {
          width: 184px;
          padding: 9px;
        }
      }
      .saved {
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
        min-width: 46px;
        padding-left: 4px;
      }
      /* Persistence failure is a recovery affordance, not a status: it stays
         loud and clickable (download JSON) until a save succeeds (#203). */
      .saved.save-failed {
        color: #ff6b6b;
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
      }
      /* Banner shown while the canvas holds a /v/<id> shared snapshot (#202).
         The explicit display beats the UA's [hidden] rule, so restate it. */
      .shared-banner[hidden] {
        display: none;
      }
      .shared-banner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 6px 12px;
        font-size: 12px;
        color: var(--text);
        background: color-mix(in srgb, var(--accent) 14%, var(--panel));
        border-bottom: 1px solid
          color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .shared-banner .tbtn {
        border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      }
      /* Cohesive, low-chrome buttons: borderless until hover/active. */
      .tbtn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        border-radius: 7px;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font);
        line-height: 1.35;
        white-space: nowrap;
        flex: none;
      }
      .tbtn:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .tbtn.ticon {
        min-width: 28px;
        padding: 5px 7px;
        font-size: 13px;
        text-align: center;
      }
      select.tbtn {
        border-color: var(--border);
      }
      select.tbtn:hover {
        border-color: var(--accent);
      }
      .tbtn.on {
        color: var(--accent);
        background: rgba(1, 169, 130, 0.12);
      }
      .tbtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .tbtn:disabled:hover {
        background: transparent;
        color: var(--muted);
      }
      /* Account chip + menu (shown only when the Worker reports a session). */
      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .user-chip .uc-dot {
        color: var(--accent);
        font-size: 9px;
        line-height: 1;
      }
      .user-chip .tlabel {
        margin-left: 0;
      }
      .user-chip .uc-caret {
        font-size: 10px;
        opacity: 0.75;
      }
      .user-menu {
        position: fixed;
        z-index: 60;
        min-width: 156px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        font-size: 12px;
      }
      /* Agent Workspace: compact handoff/proposal/lease surface. It is ordinary
         browser traffic; none of its polling is inserted into model context. */
      .workspace-chip .ws-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 5px;
        border-radius: 50%;
        background: var(--muted);
      }
      .workspace-chip.on .ws-dot {
        background: var(--accent);
        box-shadow: 0 0 7px color-mix(in srgb, var(--accent) 65%, transparent);
      }
      .workspace-chip.conflict .ws-dot {
        background: #fc6161;
      }
      /* Transient new-proposal toast near the chip (issue #212): clicks
         through to the proposal card; auto-dismisses. */
      .ws-toast {
        position: fixed;
        z-index: 65;
        padding: 7px 11px;
        background: var(--panel2);
        border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
        border-radius: 9px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        color: var(--text);
        font-family: var(--font);
        font-size: 11px;
        cursor: pointer;
      }
      .ws-toast:hover {
        border-color: var(--accent);
      }
      .workspace-panel {
        position: fixed;
        z-index: 70;
        top: 52px;
        right: 14px;
        width: min(390px, calc(100vw - 28px));
        max-height: min(680px, calc(100vh - 72px));
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(16px);
        color: var(--text);
        font-size: 11px;
      }
      .ws-head,
      .ws-row,
      .ws-actions {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .ws-head {
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .ws-head h3 {
        margin: 0;
        font-size: 13px;
      }
      .ws-card {
        margin-top: 9px;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--panel2);
      }
      .ws-k {
        color: var(--muted);
        min-width: 66px;
      }
      .ws-v {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .ws-policy {
        color: var(--accent);
        font-weight: 600;
      }
      .ws-note,
      .ws-empty {
        color: var(--muted);
        line-height: 1.5;
      }
      /* Named checkpoints (Packet R3): create row + per-checkpoint entries. */
      .ws-input {
        flex: 1 1 auto;
        min-width: 0;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 4px 8px;
        font-family: var(--font);
        font-size: 12px;
      }
      .ws-input:focus {
        border-color: var(--accent);
      }
      .ws-checkpoint {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .ws-checkpoint-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      /* Revision timeline (Packet R4). */
      .ws-rev {
        padding: 6px 0;
        border-top: 1px solid var(--border);
      }
      .ws-rev:first-child {
        border-top: none;
      }
      .ws-rev-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 2px;
      }
      .ws-rev-n {
        font-weight: 600;
      }
      .ws-badge {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .ws-src-proposal {
        color: var(--accent);
        border-color: var(--accent);
      }
      /* Authoring Preferences panel (Packets P3+P4): reuses the ws-* card
         styles; only the callouts and status badges need accents. */
      .pref-observed,
      .pref-ask,
      .pref-confirmed-note {
        color: var(--accent);
      }
      .pref-ask {
        font-weight: 600;
      }
      .pref-status-paused {
        color: #e0a44a;
        border-color: #e0a44a;
      }
      .pref-status-confirmed {
        color: var(--accent);
        border-color: var(--accent);
      }
      .pref-status-rejected,
      .pref-rejected-note {
        color: var(--muted);
      }
      .pref-review {
        color: #e0a44a;
        font-weight: 600;
      }
      .pref-stale,
      .pref-exceptions {
        color: var(--muted);
        font-style: italic;
      }
      .pref-scope-chooser {
        margin-top: 6px;
        border-style: dashed;
      }
      /* Admin dashboard (owner-only) — reuses the ws-* card styles. */
      .admin-login {
        font-weight: 600;
      }
      .admin-ws-list {
        margin-top: 6px;
      }
      .admin-ws-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .ws-src-restore {
        color: #e0a44a;
        border-color: #e0a44a;
      }
      .ws-rev-floor {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--border);
        font-style: italic;
      }
      .ws-error {
        color: #fc8181;
        line-height: 1.45;
      }
      .ws-actions {
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .ws-actions .tbtn {
        border-color: var(--border);
        font-size: 10.5px;
      }
      .ws-proposal-title {
        font-weight: 600;
        margin-bottom: 4px;
      }
      .ws-proposal-meta {
        color: var(--muted);
        margin-bottom: 6px;
      }
      .ws-ops {
        margin: 0;
        padding-left: 0;
        list-style: none;
        color: var(--muted);
        line-height: 1.5;
      }
      /* Per-operation selection rows for partial proposal acceptance. */
      .ws-op {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        cursor: pointer;
      }
      .ws-op input {
        margin: 3px 0 0;
        flex: none;
        accent-color: var(--accent);
      }
      .ws-op:hover {
        color: var(--text);
      }
      .ws-section {
        margin-top: 12px;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      /* Rendered before/after proposal preview (Packet R1). */
      .ws-preview {
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--border);
      }
      .ws-preview-pages {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 420px;
        overflow: auto;
      }
      .ws-preview-page-name {
        font-weight: 600;
        margin-bottom: 5px;
      }
      .ws-preview-frames {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ws-preview-frame {
        flex: 1 1 150px;
        min-width: 0;
      }
      .ws-preview-frame-label {
        color: var(--muted);
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 3px;
      }
      .ws-preview-frame svg {
        display: block;
        width: 100%;
        max-width: 340px;
        height: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .ws-preview-empty {
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 14px 8px;
        text-align: center;
        font-size: 10px;
      }
      .ws-preview-more {
        margin-top: 2px;
      }
      /* Geometry-aware change highlights (issue #213). Add/remove/modify are
         distinguished by color AND dash pattern (solid / dotted / dashed), so
         the encoding never rides on color alone. Strokes are non-scaling so
         halos stay legible in the compact panel frames. */
      .ws-hl {
        fill: none;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
        pointer-events: none;
      }
      .ws-hl-link,
      .ws-hl-flow {
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.85;
      }
      .ws-hl-add {
        stroke: #2fd07f; /* solid = added */
      }
      .ws-hl-remove {
        stroke: #fc6161;
        stroke-dasharray: 2 5; /* dotted = removed */
      }
      .ws-hl-mod {
        stroke: #ffcc55;
        stroke-dasharray: 8 4; /* dashed = modified */
      }
      .ws-hl-focus {
        stroke-width: 4;
        animation: ws-hl-flash 0.5s ease-in-out 3;
      }
      @keyframes ws-hl-flash {
        50% {
          opacity: 0.15;
        }
      }
      /* Operation descriptions double as locate-in-preview buttons. */
      .ws-op-jump {
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .ws-op-jump:hover {
        color: var(--text);
        text-decoration: underline dotted;
      }
      /* openToProposal / openToConflict landing flash (issue #212). */
      .ws-attention {
        animation: ws-attention-flash 0.6s ease-in-out 3;
      }
      @keyframes ws-attention-flash {
        50% {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
        }
      }
      /* Display-settings popover (ambient + glass). */
      .display-pop {
        position: fixed;
        z-index: 60;
        width: 248px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        font-size: 12px;
        color: var(--text);
        font-family: var(--font);
      }
      .display-pop .dp-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0 2px 8px;
      }
      .display-pop .dp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 2px;
      }
      .display-pop .dp-row.dp-check {
        justify-content: flex-start;
        cursor: pointer;
      }
      .display-pop select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 6px;
        font-family: var(--font);
        font-size: 12px;
      }
      .display-pop .dp-note {
        color: var(--muted);
        font-size: 10.5px;
        line-height: 1.45;
        margin-top: 6px;
        padding: 0 2px;
      }
      .display-pop .dp-h2 {
        margin-top: 10px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .display-pop .dp-swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 2px 2px 6px;
      }
      .display-pop .dp-swatch {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid var(--border);
        padding: 0;
        cursor: pointer;
        /* A diagonal split hints at the secondary colour behind the accent. */
        background-image: linear-gradient(
          135deg,
          var(--sw1) 0 60%,
          var(--sw2) 60% 100%
        );
        transition: transform 0.08s ease;
      }
      .display-pop .dp-swatch:hover {
        transform: scale(1.12);
      }
      .display-pop .dp-swatch.on {
        border-color: var(--text);
        box-shadow: 0 0 0 2px var(--panel2);
      }
      .display-pop input[type='color'] {
        width: 40px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--panel);
        cursor: pointer;
      }
      /* "No glass" — drop the panel backdrop blur for a flatter, faster look. */
      html.no-glass * {
        backdrop-filter: none !important;
      }
      .user-menu .um-head {
        color: var(--muted);
        padding: 6px 8px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .user-menu .um-head b {
        color: var(--text);
        font-weight: 700;
      }
      .user-menu .um-item {
        display: block;
        padding: 7px 8px;
        border-radius: 6px;
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
      }
      .user-menu .um-item:hover {
        background: var(--accent);
        color: #08130f;
      }
      .align-group {
        display: inline-flex;
        gap: 3px;
        padding-left: 8px;
        margin-left: 4px;
        border-left: 1px solid var(--border);
      }
      .align-group[hidden] {
        display: none;
      }
      .ab {
        padding: 5px 8px;
      }
      .arrange {
        display: inline-flex;
        gap: 3px;
      }
      .meta-top {
        margin-top: 4px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .meta-row {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .meta-row input {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 11px;
        font-family: var(--font);
      }
      .meta-row .meta-k {
        color: var(--muted);
      }
      .meta-x,
      .meta-addbtn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 11px;
      }
      .meta-addbtn:hover {
        color: var(--accent);
      }
      .meta-x:hover {
        color: #fc6161;
      }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: 0;
        display: flex;
        flex-direction: row;
      }
      /* The canvas region (canvas + floating palette/minimap/frames strip).
         The properties panel is a docked column beside it, not a floating
         overlay, so it can never overlap the canvas or the floating panels. */
      .canvas-area {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
      }
      /* Full-height left rail: header + search at the top, scrollable node list
         filling the middle, minimap docked at the bottom. */
      .palette {
        position: absolute;
        top: 12px;
        left: 12px;
        bottom: 12px;
        z-index: 6;
        width: 162px;
        overflow: hidden;
        background: rgba(34, 37, 46, 0.92);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      /* Collapsed drawer: only the toggle shows; the rail shrinks to fit it and
         the canvas reclaims the space. The docked minimap collapses with it. */
      .palette.collapsed {
        width: auto;
        bottom: auto;
      }
      .palette.collapsed .palette-search,
      .palette.collapsed .palette-list,
      .palette.collapsed .minimap-dock {
        display: none;
      }
      .palette-toggle {
        flex: none;
        width: 100%;
        font-family: var(--font);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .palette-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .palette-search {
        width: 100%;
        box-sizing: border-box;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
        margin-bottom: 4px;
      }
      .palette-search:focus {
        border-color: var(--accent);
      }
      .palette-search::placeholder {
        color: var(--muted);
      }
      .palette-list {
        display: grid;
        /* minmax(0,1fr) lets tracks shrink below their content so the two
           columns stay equal and long labels wrap/clip instead of overflowing. */
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
        align-content: start;
        overflow-y: auto;
        flex: 1 1 auto;
        min-height: 0;
      }
      /* Headers, custom rows, empty/state and the library actions span the grid. */
      .palette-list > .palette-h,
      .palette-list > .palette-empty,
      .palette-list > .pcustom,
      .palette-list > .pitem.design {
        grid-column: 1 / -1;
      }
      .palette-empty {
        color: var(--muted);
        font-size: 11px;
        padding: 6px 4px;
      }
      .palette-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 2px 4px 4px;
      }
      .pitem {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        min-width: 0;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 6px 4px;
        cursor: pointer;
        font-size: 11px;
        font-family: var(--font);
        text-align: center;
      }
      .pitem:hover {
        border-color: var(--accent);
      }
      .ppreview {
        width: 34px;
        height: 26px;
        flex: none;
      }
      .plabel {
        width: 100%;
        overflow: hidden;
        /* Wrap to at most two lines so narrow tiles keep readable labels. */
        line-height: 1.15;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-word;
      }
      /* Custom/stencil rows keep the icon-left layout (they span the full width
         and pair with an edit/delete button). */
      .pcustom .pitem {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        text-align: left;
      }
      .pitem.design {
        justify-content: center;
        color: var(--muted);
      }
      .pitem:hover {
        border-color: rgba(1, 169, 130, 0.5);
        color: var(--accent);
      }

      /* Properties / inspector panel (top-right), with a collapse toggle. */
      /* Docked properties column on the right of the stage: [resize grip][panel].
         It spans the full stage height, so it never floats over — or collides
         with — the canvas, minimap, or frames strip. */
      .inspector-wrap {
        position: relative;
        z-index: 8;
        flex: none;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        background: rgba(34, 37, 46, 0.94);
        border-left: 1px solid var(--border);
        backdrop-filter: blur(8px);
      }
      .inspector-wrap.collapsed {
        background: transparent;
        border-left: none;
      }
      .inspector-resizer {
        flex: none;
        width: 7px;
        cursor: ew-resize;
        background: transparent;
        transition: background 0.12s;
      }
      .inspector-resizer:hover,
      .inspector-resizer.active {
        background: rgba(1, 169, 130, 0.35);
      }
      .inspector-wrap.collapsed .inspector-resizer {
        display: none;
      }
      .inspector-col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 10px 10px 10px 4px;
        gap: 6px;
      }
      .inspector-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: stretch;
      }
      .inspector {
        width: 240px;
        min-width: 200px;
        flex: none;
        min-height: 0;
        overflow-y: auto;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .inspector[hidden],
      .inspector-wrap.collapsed .inspector-body {
        display: none;
      }
      .inspector-toggle {
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
      .inspector-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      /* Phone / narrow tablet (#221): the docked properties column plus the
         floating node library can consume a 390px stage, and overflow:hidden
         on the canvas area leaves no way to recover a drawing surface. Keep
         the toolbar on one scrollable row, guarantee a minimum canvas box,
         and lift the inspector into a right drawer so an open panel still
         leaves canvas peeking. JS defaults both panels closed at this
         breakpoint when the user has no stored preference. */
      @media (max-width: 640px) {
        .bar {
          overflow-x: auto;
          overflow-y: hidden;
          flex-wrap: nowrap;
        }
        .bar-left,
        .bar-right {
          flex-wrap: nowrap;
        }
        .canvas-area {
          min-width: 160px;
          min-height: 200px;
        }
        .inspector-wrap {
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          max-width: min(280px, calc(100% - 72px));
          box-shadow: -8px 0 24px rgba(0, 0, 0, 0.35);
        }
        .inspector-wrap.collapsed {
          top: 12px;
          right: 12px;
          bottom: auto;
          max-width: none;
          box-shadow: none;
        }
        .inspector {
          width: min(240px, calc(100vw - 88px));
          min-width: 0;
          max-width: 100%;
        }
        .palette {
          width: min(162px, calc(100% - 24px));
          max-height: calc(100% - 24px);
        }
      }
      .insp-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      /* Collapsible field section (Appearance / Routing / Animation / …) */
      .insp-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .insp-group > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }
      .insp-group > summary::-webkit-details-marker {
        display: none;
      }
      /* Disclosure caret, rotates when the section is open. */
      .insp-group > summary::before {
        content: '▸';
        font-size: 9px;
        color: var(--muted);
        transition: transform 0.12s ease;
      }
      .insp-group[open] > summary::before {
        transform: rotate(90deg);
      }
      .insp-group > summary:hover {
        color: var(--text);
      }
      .insp-btns {
        display: inline-flex;
        gap: 4px;
      }
      .insp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .insp-row.col {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      /* Layers section (B.3) */
      .layer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
      }
      .layer-eye {
        flex: none;
        width: 24px;
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 13px;
        padding: 2px;
      }
      .layer-name {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .layer-op {
        flex: 0 0 84px;
        accent-color: var(--accent);
      }
      .insp-hint {
        font-size: 11px;
        color: var(--muted);
        padding: 2px 0 4px;
      }
      /* Frame emphasis picker (2.4) */
      .emph-actions {
        display: flex;
        gap: 6px;
        margin: 2px 0 6px;
      }
      .emph-list {
        max-height: 168px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px;
      }
      .emph-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 5px;
        border-radius: 4px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .emph-row:hover {
        background: var(--panel2);
      }
      .emph-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .emph-type {
        flex: none;
        font-size: 10px;
        color: var(--muted);
      }
      .insp-btn {
        margin-top: 6px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
        cursor: pointer;
      }
      .insp-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .insp-row input,
      .insp-row select {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
      }
      .insp-row .hex {
        flex: none;
        width: 100%;
      }
      /* Refs editor — flow waypoints / zone members as labelled chips. */
      .refchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .refchip {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 2px 1px 6px;
        font-size: 11px;
        color: var(--text);
        max-width: 100%;
      }
      .refchip .reflbl {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 110px;
      }
      .refchip .refmv,
      .refchip .refx {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0 3px;
        font-size: 11px;
        line-height: 1;
      }
      .refchip .refmv:hover {
        color: var(--accent);
      }
      .refchip .refx:hover {
        color: #fc6161;
      }
      .refchips .refadd {
        flex: 0 0 auto;
        width: auto;
        min-width: 84px;
        padding: 3px 6px;
        font-size: 11px;
      }
      .refhint {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.4;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 4px;
      }
      .sw {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      .sw.on {
        /* Selected marker — --text so it stays visible in the light theme. */
        outline: 2px solid var(--text);
        outline-offset: 1px;
      }

      /* Annotations (zones / flow paths / policy markers) */
      .anno-top {
        margin-top: 4px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .anno-add {
        display: flex;
        gap: 4px;
      }
      .anno-add .tbtn {
        flex: 1;
        font-size: 11px;
        padding: 4px 2px;
      }
      .anno-empty {
        font-size: 11px;
        line-height: 1.4;
      }
      /* Per-type collapsible section grouping the annotation rows. */
      .anno-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .anno-group > summary.anno-group-h {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        list-style: none;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
        padding: 2px 0;
      }
      .anno-group > summary.anno-group-h::-webkit-details-marker {
        display: none;
      }
      .anno-count {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 6px;
        font-size: 10px;
        color: var(--text);
      }
      details.anno {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      details.anno > summary {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
        list-style: none;
      }
      details.anno > summary::-webkit-details-marker {
        display: none;
      }
      .anno-k {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        background: var(--panel2);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .anno-t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .anno-x {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        padding: 0 2px;
      }
      .anno-x:hover {
        color: #fc6161;
      }

      /* Custom palette items + designer */
      .pcustom {
        display: flex;
        gap: 4px;
      }
      .pcustom .pitem {
        flex: 1;
      }
      .pedit {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 7px;
        padding: 0 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .pitem.design {
        color: var(--accent);
        border-style: dashed;
      }
      .nd-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(7, 11, 18, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }
      .nd-dialog {
        width: min(920px, 94vw);
        height: min(620px, 92vh);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .nd-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .nd-title {
        font-weight: 700;
      }
      .nd-name {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 9px;
        font-family: var(--font);
        font-size: 13px;
      }
      .nd-spacer {
        flex: 1;
      }
      .nd-btn {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font-family: var(--font);
        font-size: 12px;
      }
      .nd-btn.primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 700;
      }
      .nd-body {
        flex: 1;
        display: grid;
        grid-template-columns: 200px 1fr 240px;
        min-height: 0;
      }
      .nd-col {
        overflow-y: auto;
        padding: 12px;
      }
      .nd-left {
        border-right: 1px solid var(--border);
      }
      .nd-right {
        border-left: 1px solid var(--border);
      }
      .nd-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nd-preview-wrap {
        width: 240px;
        height: 240px;
        border-radius: 12px;
        overflow: hidden;
      }
      #nd-preview {
        width: 100%;
        height: 100%;
      }
      .nd-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 12px 0 6px;
      }
      .nd-h:first-child {
        margin-top: 0;
      }
      .nd-shapes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      .nd-shape,
      .nd-icon {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px;
        cursor: pointer;
        aspect-ratio: 1;
      }
      .nd-shape svg,
      .nd-icon svg {
        width: 100%;
        height: 100%;
      }
      .nd-shape.on,
      .nd-icon.on {
        border-color: var(--accent);
        background: rgba(1, 169, 130, 0.14);
      }
      .nd-icons {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }
      .nd-icon[data-icon=''] {
        aspect-ratio: auto;
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 11px;
        padding: 5px;
      }
      .nd-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin: 5px 0;
      }
      .nd-row input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      .nd-toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        margin: 6px 0;
        cursor: pointer;
      }
      .nd-sub {
        border-left: 2px solid var(--border);
        padding: 4px 0 4px 8px;
        margin: 0 0 6px 6px;
      }
      .nd-sub select,
      .nd-sub input[type='text'] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 4px 7px;
        font-family: var(--font);
        font-size: 12px;
        margin: 3px 0;
      }
      .nd-swatches {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin: 4px 0;
      }
      .nd-sw {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      .nd-sw.on {
        /* Selected marker — --text so it stays visible in the light theme. */
        outline: 2px solid var(--text);
        outline-offset: 1px;
      }
      .stage .tds-root,
      .stage .tds-canvas-row,
      .stage .canvas-host {
        height: 100%;
        width: 100%;
      }
      /* The legacy .tds-canvas-row is a flexbox (it expected a sidebar); make it
         a plain block so the canvas fills the stage instead of collapsing. */
      .stage .tds-canvas-row {
        display: block;
      }
      .canvas-host {
        position: relative;
        /* Flatten the legacy canvas's 3D tilt so SVG getScreenCTM() maps
           cursor → user-space exactly (drag/hit-testing depend on it). */
        transform: none !important;
        perspective: none !important;
      }
      #page-canvas,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #overlay {
        cursor: default;
        touch-action: none;
      }

      /* Frames strip — a floating overlay anchored at the canvas's bottom-left
         (same model as the palette rail), not a docked row: toggling it never
         resizes or reflows the canvas. Structure:
           .frames-dock > [.frames-toggle pill][.frames-reveal > .filmstrip]
         It sits just right of the nodes rail (12 + 162 + 12) so neither the
         pill nor the strip ever overlaps the palette; when the palette
         collapses (its bottom edge freed) the dock slides home to the shared
         12px edge margin. `right: 12px` caps the strip at the canvas width
         minus margins; extra frames scroll horizontally inside the strip. */
      .frames-dock {
        position: absolute;
        left: 186px;
        right: 12px;
        bottom: 12px;
        z-index: 6; /* palette tier — floating panels over the canvas */
        display: flex;
        align-items: center;
        gap: 8px;
        /* The dock spans the canvas width; only its children take events, so
           canvas clicks/wheel in the empty span behave as bare canvas. */
        pointer-events: none;
      }
      .frames-dock > * {
        pointer-events: auto;
      }
      /* Note: the palette rail renders 162px wide at every viewport size (the
         max-width:700px shrink rule above predates the rail's base rule in
         source order, so the base width wins), so a single 186px offset keeps
         the dock clear of it at any window size. */
      .palette.collapsed ~ .frames-dock {
        left: 12px;
      }
      .frames-toggle {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: var(--font);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .frames-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .frames-ind {
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0;
      }
      /* Clips the strip while it slides; the strip carries no outer shadow
         (inset highlight only), so overflow clipping costs nothing visually. */
      .frames-reveal {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
      }
      .filmstrip {
        position: relative; /* chips' offsetParent → strip-local scroll math */
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        backdrop-filter: blur(8px);
        overflow-x: auto;
        /* Expand reveals left→right: a transform slide (never an animated
           width, so chip layout can't thrash mid-animation). */
        transform: translateX(0);
        transition: transform 0.18s ease-out;
      }
      .frames-dock.collapsed .filmstrip {
        /* Fully clear the reveal box so nothing peeks while hidden. */
        transform: translateX(calc(-100% - 24px));
      }
      /* Hidden (and hit-transparent) once the slide finishes; visibility flips
         back instantly on expand so the slide-in is visible. */
      .frames-dock.collapsed .frames-reveal {
        visibility: hidden;
        transition: visibility 0s 0.18s;
      }
      @media (prefers-reduced-motion: reduce) {
        .filmstrip,
        .frames-dock.collapsed .frames-reveal {
          transition: none;
        }
      }
      .frame {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
        font-family: var(--font);
      }
      .frame.on {
        border-color: var(--accent);
        background: rgba(1, 169, 130, 0.14);
        box-shadow: 0 0 0 1px rgba(1, 169, 130, 0.3);
      }
      .frame-n {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--border);
        font-size: 11px;
        font-weight: 700;
      }
      .frame.on .frame-n {
        background: var(--accent);
        color: var(--bg);
      }
      .frame.add {
        color: var(--muted);
        border-style: dashed;
      }
      .frame[draggable='true'] {
        cursor: grab;
      }
      .frame-x {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        padding: 0 2px;
        margin-left: 2px;
        border-radius: 4px;
      }
      .frame-x:hover {
        color: var(--red, #fc6161);
        background: rgba(252, 97, 97, 0.12);
      }
      .frame-rename {
        background: var(--bg);
        border: 1px solid var(--accent);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-family: var(--font);
        width: 120px;
      }

      /* Right-click context menu (positioned at the cursor). */
      .ctx-menu {
        position: fixed;
        z-index: 1000;
        min-width: 168px;
        padding: 4px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        font-family: var(--font);
        font-size: 12px;
        user-select: none;
      }
      .ctx-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 5px;
        color: var(--text);
        font-family: var(--font);
        font-size: 12px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .ctx-item:hover:not(:disabled) {
        background: rgba(1, 169, 130, 0.16);
        color: var(--accent);
      }
      .ctx-item:disabled {
        color: var(--muted);
        cursor: default;
      }
      .ctx-sep {
        height: 1px;
        margin: 4px 6px;
        background: var(--border);
      }

      /* Problems panel (bottom-left of the canvas) — live validation + layout. */
      /* Problems section pinned to the bottom of the right rail: property
         sections scroll above it, this stays put. A header row (label + count
         badge + chevron) is always visible; the list expands below it. */
      .problems-dock {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        min-height: 0;
      }
      .problems-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px 9px;
        cursor: pointer;
      }
      .problems-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .pt-label {
        font-weight: 500;
        letter-spacing: 0.3px;
      }
      .pt-chev {
        margin-left: auto;
        opacity: 0.7;
      }
      .prob-count {
        min-width: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--panel2);
        border: 1px solid var(--border);
        font-size: 10px;
        line-height: 16px;
        text-align: center;
        color: var(--muted);
      }
      .problems-dock.has-warn .problems-toggle {
        color: #e0a44a;
        border-color: #e0a44a;
      }
      .problems-dock.has-warn .prob-count {
        color: #1d1f27;
        background: #e0a44a;
        border-color: #e0a44a;
      }
      .problems-dock.has-error .problems-toggle {
        color: #fc6161;
        border-color: #fc6161;
      }
      .problems-dock.has-error .prob-count {
        color: #1d1f27;
        background: #fc6161;
        border-color: #fc6161;
      }
      .problems {
        max-height: 34vh;
        overflow-y: auto;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .problems-dock.collapsed .problems {
        display: none;
      }
      /* When the whole right rail is collapsed, the pinned section goes with it. */
      .inspector-wrap.collapsed .problems-dock {
        display: none;
      }
      .prob-empty {
        font-size: 11px;
        color: var(--muted);
        padding: 4px 6px;
      }
      .prob {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
        background: none;
        border: none;
        border-radius: 5px;
        padding: 4px 6px;
        cursor: default;
        font-family: var(--font);
        font-size: 11px;
        color: var(--text);
      }
      .prob.locatable {
        cursor: pointer;
      }
      .prob.locatable:hover {
        background: var(--panel);
      }
      .prob-dot {
        flex: none;
        width: 7px;
        height: 7px;
        margin-top: 4px;
        border-radius: 50%;
      }
      .prob-error .prob-dot {
        background: #fc6161;
      }
      .prob-warning .prob-dot {
        background: #e0a44a;
      }
      .prob-msg {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .prob-where {
        color: var(--muted);
        font-size: 10px;
      }

      /* Minimap overview (bottom-right of the canvas), with a collapse toggle. */
      /* Minimap docked at the bottom of the left rail, separated by a border.
         Fixed aspect (matches the MM_W:MM_H viewBox so pointer→pan mapping stays
         exact with no letterboxing); its height is content-driven, so it never
         shifts when the node list above is scrolled or filtered. */
      .minimap-dock {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 4px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .minimap {
        width: 100%;
        aspect-ratio: 170 / 120;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }
      .minimap-dock.collapsed .minimap {
        display: none;
      }
      .minimap-toggle {
        width: 100%;
        font-family: var(--font);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .minimap-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      /* Find / jump-to-element overlay (Ctrl+F). */
      .find {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        width: 340px;
        padding: 6px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        font-family: var(--font);
      }
      .find input {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        padding: 7px 9px;
      }
      .find input:focus {
        border-color: var(--accent);
      }
      .find-results {
        margin-top: 6px;
        max-height: 240px;
        overflow-y: auto;
      }
      .find-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 9px;
        border-radius: 5px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .find-item.on,
      .find-item:hover {
        background: rgba(1, 169, 130, 0.16);
        color: var(--accent);
      }
      .find-item .fi-type {
        color: var(--muted);
      }
      .find-empty {
        padding: 6px 9px;
        font-size: 12px;
        color: var(--muted);
      }

      /* On-canvas zoom / pan controls (bottom-left of the canvas). */
      .canvas-ctrls {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 9;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: color-mix(in srgb, var(--panel) 86%, transparent);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px);
      }
      .cc-btn {
        min-width: 26px;
        height: 26px;
        padding: 0 6px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--muted);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .cc-btn:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .cc-btn.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .cc-btn.cc-zoom {
        min-width: 48px;
        font-size: 12px;
        color: var(--text);
      }

      /* Keyboard-shortcut help overlay. */
      .help-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
      }
      .help-card {
        width: min(760px, 92vw);
        max-height: 86vh;
        overflow-y: auto;
        padding: 18px 20px 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        font-family: var(--font);
      }
      .help-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .help-head h3 {
        margin: 0;
        font-size: 14px;
        color: var(--text);
      }
      .help-cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px 22px;
      }
      .help-col h4 {
        margin: 0 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
      }
      .help-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
        font-size: 12px;
        color: var(--text);
      }
      .help-row kbd {
        flex: none;
        padding: 1px 6px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .help-row span {
        text-align: right;
        color: var(--muted);
      }

      /* ════════════════════════════════════════════════════════════════
         SPATIAL UI — visionOS-inspired frosted glass.
         Floating cards over a depth backdrop, pill controls, soft layered
         shadows, generous whitespace, gentle hover lift. Appended last so it
         layers cleanly over the base chrome (and is easy to tune or revert).
         ════════════════════════════════════════════════════════════════ */
      :root {
        --glass-bg: rgba(26, 29, 38, 0.5);
        --glass-bg-strong: rgba(26, 29, 38, 0.66);
        --glass-brd: rgba(255, 255, 255, 0.1);
        --glass-hi: rgba(255, 255, 255, 0.14);
        --glass-blur: 26px;
        --glass-sat: 165%;
        --r-card: 20px;
        --r-pill: 13px;
        --shadow-card:
          0 24px 60px -24px rgba(0, 0, 0, 0.72),
          0 6px 18px -10px rgba(0, 0, 0, 0.55);
        --shadow-float: 0 10px 28px -12px rgba(0, 0, 0, 0.55);
        --ease: cubic-bezier(0.4, 0.5, 0.2, 1);
      }
      :root.light {
        --glass-bg: rgba(255, 255, 255, 0.62);
        --glass-bg-strong: rgba(255, 255, 255, 0.76);
        --glass-brd: rgba(255, 255, 255, 0.75);
        --glass-hi: rgba(255, 255, 255, 0.95);
        --glass-sat: 180%;
        --shadow-card:
          0 24px 55px -24px rgba(31, 41, 55, 0.38),
          0 6px 16px -10px rgba(31, 41, 55, 0.22);
        --shadow-float: 0 10px 26px -12px rgba(31, 41, 55, 0.26);
      }

      /* Flat stage backdrop — a single flat fill, no radial sheen/vignette.
         Glow is now an emphasis-only channel, so the stage stays crisp. */
      body {
        background: var(--canvas-bg);
      }
      /* Canvas: a single flat fill matching the stage. The `.tds-root` stays
         transparent so the flat body colour flows edge to edge under the
         floating chrome; the `.tds-canvas` carries the explicit flat fill. */
      .tds-root {
        background: transparent !important;
      }
      .tds-canvas {
        background: var(--canvas-bg) !important;
      }
      /* Neutralize the vendored engine's animated blurred ambient light-leak
         layers + canvas glow overlays — the backdrop is now one flat tone. */
      .tds-root::before,
      .tds-root::after,
      .tds-canvas::before,
      .tds-canvas::after {
        display: none !important;
      }

      /* ── Toolbar → a floating glass bar ──────────────────────────────── */
      .bar {
        margin: 12px 12px 0;
        padding: 9px 12px;
        gap: 8px;
        border: 1px solid var(--glass-brd);
        border-radius: var(--r-card);
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(var(--glass-blur))
          saturate(var(--glass-sat));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
        box-shadow:
          var(--shadow-card),
          inset 0 1px 0 var(--glass-hi);
      }
      /* Control clusters → soft segmented pills. Borderless: a faint inset fill
         + hairline highlight reads as one recessed control, not a boxed group. */
      .tgroup {
        gap: 1px;
        padding: 2px;
        border-radius: var(--r-pill);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid transparent;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
      :root.light .tgroup {
        background: rgba(90, 105, 130, 0.07);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      /* Dividers are redundant now the clusters are visually grouped. */
      .bar-div {
        background: transparent;
        width: 0;
        margin: 0 2px;
      }
      .tbtn {
        border-radius: 10px;
        transition:
          background 0.18s var(--ease),
          color 0.18s var(--ease),
          transform 0.12s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .tbtn:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
      }
      :root.light .tbtn:hover {
        background: rgba(90, 105, 130, 0.14);
      }
      .tbtn:active {
        transform: translateY(0);
      }
      .tbtn.on {
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      select.tbtn {
        border-color: var(--glass-brd);
        background: rgba(255, 255, 255, 0.04);
      }
      :root.light select.tbtn {
        background: rgba(90, 105, 130, 0.06);
      }

      /* ── Floating glass cards (over the canvas) ──────────────────────── */
      .palette,
      .inspector-wrap,
      .display-pop,
      .user-menu,
      .ctx-menu,
      .find,
      .help {
        background: var(--glass-bg) !important;
        border: 1px solid var(--glass-brd) !important;
        -webkit-backdrop-filter: blur(var(--glass-blur))
          saturate(var(--glass-sat));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
        box-shadow:
          var(--shadow-card),
          inset 0 1px 0 var(--glass-hi);
      }
      .palette {
        border-radius: var(--r-card);
        padding: 10px;
      }
      /* Detach the inspector from the right edge so it reads as a floating card. */
      .inspector-wrap {
        margin: 12px 12px 12px 0;
        border-radius: var(--r-card) !important;
        border-left: 1px solid var(--glass-brd) !important;
        overflow: hidden;
      }
      .inspector-wrap.collapsed {
        background: transparent !important;
        border: none !important;
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      .display-pop,
      .user-menu,
      .ctx-menu {
        border-radius: 16px !important;
      }
      /* Right-click menu hover → brand accent (matches the palette + glass). */
      .ctx-item:hover:not(:disabled) {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }

      /* Small floating toggles + canvas controls → frosted pills with lift. */
      .palette-toggle,
      .inspector-toggle,
      .minimap-toggle,
      .problems-toggle,
      .frames-toggle,
      .canvas-ctrls {
        background: var(--glass-bg-strong) !important;
        border: 1px solid var(--glass-brd) !important;
        border-radius: var(--r-pill) !important;
        -webkit-backdrop-filter: blur(18px) saturate(var(--glass-sat));
        backdrop-filter: blur(18px) saturate(var(--glass-sat));
        box-shadow: var(--shadow-float);
        transition:
          transform 0.12s var(--ease),
          box-shadow 0.18s var(--ease),
          border-color 0.18s var(--ease);
      }
      .inspector-toggle:hover,
      .minimap-toggle:hover,
      .problems-toggle:hover,
      .frames-toggle:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-card);
      }
      .canvas-ctrls {
        padding: 4px;
        gap: 3px;
      }
      .cc-btn {
        border-radius: 9px !important;
        transition:
          background 0.16s var(--ease),
          transform 0.12s var(--ease);
      }
      .cc-btn:hover {
        transform: translateY(-1px);
      }

      /* ── Bottom chrome ─────────────────────────────────────────────────
         The frames strip floats over the canvas (a glass card of its own);
         the status bar stays docked below the stage as a standalone card. */
      .filmstrip {
        gap: 10px;
        border: 1px solid var(--glass-brd);
        border-radius: var(--r-card);
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(var(--glass-blur))
          saturate(var(--glass-sat));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
        box-shadow: inset 0 1px 0 var(--glass-hi);
      }
      .statusbar {
        margin: 8px 12px 12px;
        padding: 6px 16px;
        border: 1px solid var(--glass-brd);
        border-radius: var(--r-card);
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(var(--glass-blur))
          saturate(var(--glass-sat));
        backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
        box-shadow: var(--shadow-card);
      }
      /* Frames → frosted pills that lift on hover; active picks up the accent. */
      .frame {
        border: 1px solid var(--glass-brd);
        border-radius: var(--r-pill);
        background: rgba(255, 255, 255, 0.05);
        transition:
          transform 0.12s var(--ease),
          background 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      :root.light .frame {
        background: rgba(90, 105, 130, 0.08);
      }
      .frame:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-float);
      }
      .frame.on {
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent);
      }

      /* Inputs + node tiles → softer, rounder to match the glass language. */
      .palette-search,
      .palette-toggle {
        border-radius: var(--r-pill) !important;
      }
      .pitem {
        border-radius: 11px !important;
        transition:
          transform 0.12s var(--ease),
          border-color 0.16s var(--ease),
          background 0.16s var(--ease);
      }
      .pitem:hover {
        transform: translateY(-1px);
      }

      /* Honour the "panel blur (glass)" toggle: when off, fall back to solid
         surfaces so the chrome stays legible without backdrop-filter. */
      html.no-glass .bar,
      html.no-glass .filmstrip,
      html.no-glass .statusbar,
      html.no-glass .palette,
      html.no-glass .inspector-wrap,
      html.no-glass .minimap,
      html.no-glass .problems,
      html.no-glass .display-pop,
      html.no-glass .user-menu,
      html.no-glass .ctx-menu,
      html.no-glass .find,
      html.no-glass .help {
        background: var(--panel) !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
