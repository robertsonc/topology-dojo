<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Topology Dojo</title>
    <!-- JetBrains Mono is self-hosted via @fontsource (imported in main.ts) so
         the app renders identically offline / on Cloudflare with no external fetch. -->
    <!-- Vendored legacy renderer + theme. Loaded as classic scripts that expose
         window.TopologyDesigner; `defer` keeps the 300KB+ engine from blocking
         HTML parsing while still guaranteeing it runs (in order) before the
         deferred entry module that consumes it. -->
    <link rel="stylesheet" href="/vendor/topology-ds.css" />
    <script src="/vendor/core/graph.js" defer></script>
    <script src="/vendor/topology-ds.js" defer></script>
    <style>
      :root {
        --bg: #1d1f27;
        --panel: #22252e;
        --panel2: #292d3a;
        --border: #3e4550;
        --text: #e6e8e9;
        --muted: #7d8a92;
        --accent: #01a982;
        --font: 'JetBrains Mono', ui-monospace, monospace;
      }
      /* Light theme — overrides the chrome + canvas backdrop (engine node art
         keeps its own colors, which read fine on a light canvas). */
      :root.light {
        --bg: #f4f6f8;
        --panel: #ffffff;
        --panel2: #eaeef2;
        --border: #cdd5dd;
        --text: #1d1f27;
        --muted: #5c6b76;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        /* Constrain the single column so the wide legacy canvas can't blow out
           the grid past the viewport (keeps absolute UI like the minimap in view). */
        grid-template-columns: minmax(0, 1fr);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Status bar — live tool / cursor / counts / zoom readout. */
      .statusbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 4px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 11px;
        font-family: var(--font);
        white-space: nowrap;
        overflow-x: auto;
      }
      .statusbar .sb-k {
        color: var(--text);
      }
      .statusbar .sb-hint {
        margin-left: auto;
        color: var(--muted);
        opacity: 0.85;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        overflow-x: auto;
        overflow-y: hidden;
      }
      .bar-left,
      .bar-right {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 3px;
      }
      .bar-right {
        justify-content: flex-end;
      }
      /* A cluster of related controls; dividers separate clusters. */
      .tgroup {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .bar-div {
        flex: none;
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 4px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-right: 2px;
        user-select: none;
      }
      .logo-mark {
        display: block;
        color: var(--accent);
        flex: none;
      }
      .wordmark {
        font-size: 13px;
        letter-spacing: 0.3px;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
      }
      .wordmark b {
        color: var(--text);
        font-weight: 700;
        margin-left: 2px;
      }
      .tlabel {
        margin-left: 5px;
      }
      /* Graceful degradation as the bar narrows: first collapse tool/action
         labels to their icons, then drop the wordmark text (logo stays). */
      @media (max-width: 1480px) {
        .tlabel {
          display: none;
        }
      }
      @media (max-width: 1360px) {
        .wordmark {
          display: none;
        }
      }
      /* Narrow viewports: let the toolbar wrap to rows instead of clipping, and
         shrink the floating panels so the canvas stays usable. */
      @media (max-width: 880px) {
        .bar {
          overflow-x: visible;
          flex-wrap: wrap;
          row-gap: 4px;
        }
        .bar-left,
        .bar-right {
          flex-wrap: wrap;
        }
      }
      @media (max-width: 700px) {
        .palette {
          width: 108px;
          padding: 8px;
        }
        .inspector {
          width: 184px;
          padding: 9px;
        }
        .minimap {
          width: 140px;
          height: 96px;
        }
        .problems {
          max-width: calc(100vw - 24px);
        }
      }
      .saved {
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
        min-width: 46px;
        padding-left: 4px;
      }
      /* Cohesive, low-chrome buttons: borderless until hover/active. */
      .tbtn {
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        border-radius: 7px;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font);
        line-height: 1.35;
        white-space: nowrap;
        flex: none;
      }
      .tbtn:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .tbtn.ticon {
        min-width: 28px;
        padding: 5px 7px;
        font-size: 13px;
        text-align: center;
      }
      select.tbtn {
        border-color: var(--border);
      }
      select.tbtn:hover {
        border-color: var(--accent);
      }
      .tbtn.on {
        color: var(--accent);
        background: rgba(1, 169, 130, 0.12);
      }
      .tbtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .tbtn:disabled:hover {
        background: transparent;
        color: var(--muted);
      }
      /* Signed-in user chip (shown only when the Worker reports a session). */
      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .user-chip .uc-dot {
        color: var(--accent);
        font-size: 9px;
        line-height: 1;
      }
      .user-chip .tlabel {
        margin-left: 0;
      }
      .align-group {
        display: inline-flex;
        gap: 3px;
        padding-left: 8px;
        margin-left: 4px;
        border-left: 1px solid var(--border);
      }
      .align-group[hidden] {
        display: none;
      }
      .ab {
        padding: 5px 8px;
      }
      .arrange {
        display: inline-flex;
        gap: 3px;
      }
      .meta-top {
        margin-top: 4px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .meta-row {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .meta-row input {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 4px 6px;
        font-size: 11px;
        font-family: var(--font);
      }
      .meta-row .meta-k {
        color: var(--muted);
      }
      .meta-x,
      .meta-addbtn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 11px;
      }
      .meta-addbtn:hover {
        color: var(--accent);
      }
      .meta-x:hover {
        color: #fc6161;
      }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: 0;
        display: flex;
        flex-direction: row;
      }
      /* The canvas region (canvas + floating palette/minimap/problems). The
         properties panel is a docked column beside it, not a floating overlay,
         so it can never overlap the canvas, minimap, or filmstrip. */
      .canvas-area {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
      }
      .palette {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 6;
        width: 132px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: rgba(34, 37, 46, 0.92);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .palette-search {
        position: sticky;
        top: 0;
        z-index: 1;
        width: 100%;
        box-sizing: border-box;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
        margin-bottom: 4px;
      }
      .palette-search:focus {
        outline: none;
        border-color: var(--accent);
      }
      .palette-search::placeholder {
        color: var(--muted);
      }
      .palette-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .palette-empty {
        color: var(--muted);
        font-size: 11px;
        padding: 6px 4px;
      }
      .palette-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 2px 4px 4px;
      }
      .pitem {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 7px;
        padding: 5px 8px;
        cursor: pointer;
        font-size: 12px;
        font-family: var(--font);
        text-align: left;
      }
      .pitem:hover {
        border-color: var(--accent);
      }
      .ppreview {
        width: 32px;
        height: 24px;
        flex: none;
      }
      .plabel {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pitem.design {
        justify-content: center;
        color: var(--muted);
      }
      .pdefs {
        position: absolute;
        width: 0;
        height: 0;
      }
      .pitem:hover {
        border-color: rgba(1, 169, 130, 0.5);
        color: var(--accent);
      }

      /* Properties / inspector panel (top-right), with a collapse toggle. */
      /* Docked properties column on the right of the stage: [resize grip][panel].
         It spans the full stage height (above the filmstrip), so it never floats
         over — or collides with — the canvas, minimap, or filmstrip. */
      .inspector-wrap {
        position: relative;
        z-index: 8;
        flex: none;
        display: flex;
        flex-direction: row;
        align-items: stretch;
        background: rgba(34, 37, 46, 0.94);
        border-left: 1px solid var(--border);
        backdrop-filter: blur(8px);
      }
      .inspector-wrap.collapsed {
        background: transparent;
        border-left: none;
      }
      .inspector-resizer {
        flex: none;
        width: 7px;
        cursor: ew-resize;
        background: transparent;
        transition: background 0.12s;
      }
      .inspector-resizer:hover,
      .inspector-resizer.active {
        background: rgba(1, 169, 130, 0.35);
      }
      .inspector-wrap.collapsed .inspector-resizer {
        display: none;
      }
      .inspector-col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 10px 10px 10px 4px;
        gap: 6px;
      }
      .inspector-body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: stretch;
      }
      .inspector {
        width: 240px;
        min-width: 200px;
        flex: none;
        min-height: 0;
        overflow-y: auto;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .inspector[hidden],
      .inspector-wrap.collapsed .inspector-body {
        display: none;
      }
      .inspector-toggle {
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
      .inspector-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .insp-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      /* Collapsible field section (Appearance / Routing / Animation / …) */
      .insp-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .insp-group > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }
      .insp-group > summary::-webkit-details-marker {
        display: none;
      }
      /* Disclosure caret, rotates when the section is open. */
      .insp-group > summary::before {
        content: '▸';
        font-size: 9px;
        color: var(--muted);
        transition: transform 0.12s ease;
      }
      .insp-group[open] > summary::before {
        transform: rotate(90deg);
      }
      .insp-group > summary:hover {
        color: var(--text);
      }
      .insp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .insp-row.col {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      /* Layers section (B.3) */
      .layer-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
      }
      .layer-eye {
        flex: none;
        width: 24px;
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 13px;
        padding: 2px;
      }
      .layer-name {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .layer-op {
        flex: 0 0 84px;
        accent-color: var(--accent);
      }
      .insp-hint {
        font-size: 11px;
        color: var(--muted);
        padding: 2px 0 4px;
      }
      /* Frame emphasis picker (2.4) */
      .emph-actions {
        display: flex;
        gap: 6px;
        margin: 2px 0 6px;
      }
      .emph-list {
        max-height: 168px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px;
      }
      .emph-row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 3px 5px;
        border-radius: 4px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .emph-row:hover {
        background: var(--panel2);
      }
      .emph-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .emph-type {
        flex: none;
        font-size: 10px;
        color: var(--muted);
      }
      .insp-btn {
        margin-top: 6px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
        cursor: pointer;
      }
      .insp-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .insp-row input,
      .insp-row select {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        font-size: 12px;
        font-family: var(--font);
      }
      .insp-row .hex {
        flex: none;
        width: 100%;
      }
      /* Refs editor — flow waypoints / zone members as labelled chips. */
      .refchips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .refchip {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 2px 1px 6px;
        font-size: 11px;
        color: var(--text);
        max-width: 100%;
      }
      .refchip .reflbl {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 110px;
      }
      .refchip .refmv,
      .refchip .refx {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 0 3px;
        font-size: 11px;
        line-height: 1;
      }
      .refchip .refmv:hover {
        color: var(--accent);
      }
      .refchip .refx:hover {
        color: #fc6161;
      }
      .refchips .refadd {
        flex: 0 0 auto;
        width: auto;
        min-width: 84px;
        padding: 3px 6px;
        font-size: 11px;
      }
      .refhint {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.4;
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 4px;
      }
      .sw {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      .sw.on {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }

      /* Annotations (zones / flow paths / policy markers) */
      .anno-top {
        margin-top: 4px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .anno-add {
        display: flex;
        gap: 4px;
      }
      .anno-add .tbtn {
        flex: 1;
        font-size: 11px;
        padding: 4px 2px;
      }
      .anno-empty {
        font-size: 11px;
        line-height: 1.4;
      }
      /* Per-type collapsible section grouping the annotation rows. */
      .anno-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .anno-group > summary.anno-group-h {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        list-style: none;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--muted);
        padding: 2px 0;
      }
      .anno-group > summary.anno-group-h::-webkit-details-marker {
        display: none;
      }
      .anno-count {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0 6px;
        font-size: 10px;
        color: var(--text);
      }
      details.anno {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      details.anno > summary {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-size: 12px;
        color: var(--text);
        list-style: none;
      }
      details.anno > summary::-webkit-details-marker {
        display: none;
      }
      .anno-k {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        background: var(--panel2);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .anno-t {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .anno-x {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        padding: 0 2px;
      }
      .anno-x:hover {
        color: #fc6161;
      }

      /* Custom palette items + designer */
      .pcustom {
        display: flex;
        gap: 4px;
      }
      .pcustom .pitem {
        flex: 1;
      }
      .pedit {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 7px;
        padding: 0 8px;
        cursor: pointer;
        font-size: 12px;
      }
      .pitem.design {
        color: var(--accent);
        border-style: dashed;
      }
      .nd-modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(7, 11, 18, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }
      .nd-dialog {
        width: min(920px, 94vw);
        height: min(620px, 92vh);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .nd-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .nd-title {
        font-weight: 700;
      }
      .nd-name {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 9px;
        font-family: var(--font);
        font-size: 13px;
      }
      .nd-spacer {
        flex: 1;
      }
      .nd-btn {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
        font-family: var(--font);
        font-size: 12px;
      }
      .nd-btn.primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 700;
      }
      .nd-body {
        flex: 1;
        display: grid;
        grid-template-columns: 200px 1fr 240px;
        min-height: 0;
      }
      .nd-col {
        overflow-y: auto;
        padding: 12px;
      }
      .nd-left {
        border-right: 1px solid var(--border);
      }
      .nd-right {
        border-left: 1px solid var(--border);
      }
      .nd-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nd-preview-wrap {
        width: 240px;
        height: 240px;
        border-radius: 12px;
        overflow: hidden;
      }
      #nd-preview {
        width: 100%;
        height: 100%;
      }
      .nd-h {
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 12px 0 6px;
      }
      .nd-h:first-child {
        margin-top: 0;
      }
      .nd-shapes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }
      .nd-shape,
      .nd-icon {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 4px;
        cursor: pointer;
        aspect-ratio: 1;
      }
      .nd-shape svg,
      .nd-icon svg {
        width: 100%;
        height: 100%;
      }
      .nd-shape.on,
      .nd-icon.on {
        border-color: var(--accent);
        background: rgba(1, 169, 130, 0.14);
      }
      .nd-icons {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
      }
      .nd-icon[data-icon=''] {
        aspect-ratio: auto;
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 11px;
        padding: 5px;
      }
      .nd-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin: 5px 0;
      }
      .nd-row input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      .nd-toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        margin: 6px 0;
        cursor: pointer;
      }
      .nd-sub {
        border-left: 2px solid var(--border);
        padding: 4px 0 4px 8px;
        margin: 0 0 6px 6px;
      }
      .nd-sub select,
      .nd-sub input[type='text'] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 4px 7px;
        font-family: var(--font);
        font-size: 12px;
        margin: 3px 0;
      }
      .nd-swatches {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin: 4px 0;
      }
      .nd-sw {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      .nd-sw.on {
        outline: 2px solid #fff;
        outline-offset: 1px;
      }
      .stage .tds-root,
      .stage .tds-canvas-row,
      .stage .canvas-host {
        height: 100%;
        width: 100%;
      }
      /* The legacy .tds-canvas-row is a flexbox (it expected a sidebar); make it
         a plain block so the canvas fills the stage instead of collapsing. */
      .stage .tds-canvas-row {
        display: block;
      }
      .canvas-host {
        position: relative;
        /* Flatten the legacy canvas's 3D tilt so SVG getScreenCTM() maps
           cursor → user-space exactly (drag/hit-testing depend on it). */
        transform: none !important;
        perspective: none !important;
      }
      #page-canvas,
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #overlay {
        cursor: default;
        touch-action: none;
      }

      .filmstrip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        overflow-x: auto;
      }
      .frame {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 12px;
        font-family: var(--font);
      }
      .frame.on {
        border-color: var(--accent);
        background: rgba(1, 169, 130, 0.14);
        box-shadow: 0 0 0 1px rgba(1, 169, 130, 0.3);
      }
      .frame-n {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--border);
        font-size: 11px;
        font-weight: 700;
      }
      .frame.on .frame-n {
        background: var(--accent);
        color: var(--bg);
      }
      .frame.add {
        color: var(--muted);
        border-style: dashed;
      }
      .frame[draggable='true'] {
        cursor: grab;
      }
      .frame-x {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
        padding: 0 2px;
        margin-left: 2px;
        border-radius: 4px;
      }
      .frame-x:hover {
        color: var(--red, #fc6161);
        background: rgba(252, 97, 97, 0.12);
      }
      .frame-rename {
        background: var(--bg);
        border: 1px solid var(--accent);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-family: var(--font);
        width: 120px;
      }

      /* Right-click context menu (positioned at the cursor). */
      .ctx-menu {
        position: fixed;
        z-index: 1000;
        min-width: 168px;
        padding: 4px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        font-family: var(--font);
        font-size: 12px;
        user-select: none;
      }
      .ctx-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 5px;
        color: var(--text);
        font-family: var(--font);
        font-size: 12px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .ctx-item:hover:not(:disabled) {
        background: rgba(1, 169, 130, 0.16);
        color: var(--accent);
      }
      .ctx-item:disabled {
        color: var(--muted);
        cursor: default;
      }
      .ctx-sep {
        height: 1px;
        margin: 4px 6px;
        background: var(--border);
      }

      /* Problems panel (bottom-left of the canvas) — live validation + layout. */
      .problems-wrap {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: min(360px, calc(100% - 24px));
      }
      .problems-toggle {
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 9px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
      .problems-wrap.has-warn .problems-toggle {
        color: #e0a44a;
        border-color: #e0a44a;
      }
      .problems-wrap.has-error .problems-toggle {
        color: #fc6161;
        border-color: #fc6161;
      }
      .problems {
        max-height: 40vh;
        overflow-y: auto;
        background: rgba(34, 37, 46, 0.94);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        backdrop-filter: blur(8px);
      }
      .problems-wrap.collapsed .problems {
        display: none;
      }
      .prob-empty {
        font-size: 11px;
        color: var(--muted);
        padding: 4px 6px;
      }
      .prob {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
        background: none;
        border: none;
        border-radius: 5px;
        padding: 4px 6px;
        cursor: default;
        font-family: var(--font);
        font-size: 11px;
        color: var(--text);
      }
      .prob[data-prob-node] {
        cursor: pointer;
      }
      .prob[data-prob-node]:hover {
        background: var(--panel2);
      }
      .prob-dot {
        flex: none;
        width: 7px;
        height: 7px;
        margin-top: 4px;
        border-radius: 50%;
      }
      .prob-error .prob-dot {
        background: #fc6161;
      }
      .prob-warning .prob-dot {
        background: #e0a44a;
      }
      .prob-msg {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .prob-where {
        color: var(--muted);
        font-size: 10px;
      }

      /* Minimap overview (bottom-right of the canvas), with a collapse toggle. */
      .minimap-wrap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 7;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
      .minimap {
        width: 170px;
        height: 120px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }
      .minimap-wrap.collapsed .minimap {
        display: none;
      }
      .minimap-toggle {
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px 8px;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
      .minimap-toggle:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      /* Find / jump-to-element overlay (Ctrl+F). */
      .find {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        width: 340px;
        padding: 6px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        font-family: var(--font);
      }
      .find input {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        padding: 7px 9px;
        outline: none;
      }
      .find input:focus {
        border-color: var(--accent);
      }
      .find-results {
        margin-top: 6px;
        max-height: 240px;
        overflow-y: auto;
      }
      .find-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 9px;
        border-radius: 5px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .find-item.on,
      .find-item:hover {
        background: rgba(1, 169, 130, 0.16);
        color: var(--accent);
      }
      .find-item .fi-type {
        color: var(--muted);
      }
      .find-empty {
        padding: 6px 9px;
        font-size: 12px;
        color: var(--muted);
      }

      /* On-canvas zoom / pan controls (bottom-left of the canvas). */
      .canvas-ctrls {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 9;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: color-mix(in srgb, var(--panel) 86%, transparent);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(6px);
      }
      .cc-btn {
        min-width: 26px;
        height: 26px;
        padding: 0 6px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--muted);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      .cc-btn:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .cc-btn.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      .cc-btn.cc-zoom {
        min-width: 48px;
        font-size: 12px;
        color: var(--text);
      }

      /* Keyboard-shortcut help overlay. */
      .help-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(2px);
      }
      .help-card {
        width: min(760px, 92vw);
        max-height: 86vh;
        overflow-y: auto;
        padding: 18px 20px 20px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        font-family: var(--font);
      }
      .help-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .help-head h3 {
        margin: 0;
        font-size: 14px;
        color: var(--text);
      }
      .help-cols {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px 22px;
      }
      .help-col h4 {
        margin: 0 0 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
      }
      .help-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
        font-size: 12px;
        color: var(--text);
      }
      .help-row kbd {
        flex: none;
        padding: 1px 6px;
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: var(--font);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .help-row span {
        text-align: right;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
