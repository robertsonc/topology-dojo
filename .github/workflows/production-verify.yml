name: Production Verify

# Production-safe verification (initiative O / docs/ALERTS.md): the same
# credential-free, non-mutating HTTP smoke the deploy pipeline runs, aimed at
# the production origin. Two triggers:
#
#   - workflow_dispatch: on-demand verification (incident triage, game-day
#     Phase 3 read-only checks, post-deploy spot checks). The optional
#     `expected_sha` input turns the /healthz check into a deployed-SHA
#     assertion — dispatch with the SHA the latest production deploy run
#     recorded to detect a deployed-SHA mismatch.
#   - schedule: a daily synthetic check of production, currently the only
#     automated production-outage signal (Cloudflare-side alerting is a
#     human-configured, separate layer — see docs/CLOUDFLARE_OPERATOR_RUNBOOK.md).
#
# Notification is GitHub-native and deduplicated, mirroring
# nightly-staging-smoke.yml: a failure files or updates a single
# `production-smoke`-labelled issue; a subsequent green run comments on and
# closes it. The smoke script sends no credentials and mutates no user state
# (scripts/smoke.mjs header), so this workflow is safe to run at any time and
# needs no environment approval or secret.
on:
  schedule:
    - cron: '30 7 * * *' # 07:30 UTC daily (before the 08:00 staging smoke)
  workflow_dispatch:
    inputs:
      expected_sha:
        description: >-
          Commit SHA production is expected to serve (from the latest
          Deploy Production run). When set, /healthz must report exactly
          this SHA or the run fails — the deployed-SHA mismatch check.
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

# Never overlap two verification runs; never cancel one mid-flight (its
# result is the point).
concurrency:
  group: production-verify
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://topology-dojo.harnessed.cloud

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # smoke.mjs is a standalone Node script (built-in fetch only), so no
      # `npm ci` is needed. `expected_sha` is free-text workflow_dispatch
      # input: passed through `env:` and appended as a discrete argument,
      # never interpolated into the script text.
      - name: Smoke test production
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -o pipefail
          ARGS=(--json)
          if [ -n "$EXPECTED_SHA" ]; then
            ARGS+=(--sha "$EXPECTED_SHA")
          fi
          node scripts/smoke.mjs "$PRODUCTION_URL" "${ARGS[@]}" \
            | tee smoke-output.txt

      - name: Write verification summary
        if: always()
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          {
            echo "### Topology Dojo production verification"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | \`$PRODUCTION_URL\` |"
            echo "| Expected SHA | \`${EXPECTED_SHA:-(not asserted)}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo ""
            echo "#### Smoke result"
            echo ""
            echo '```json'
            tail -n 1 smoke-output.txt 2>/dev/null || echo "(smoke did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              summary = fs.readFileSync('smoke-output.txt', 'utf8').trim();
            } catch {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'production-smoke';
            const body = [
              'Production verification **failed**.',
              '',
              `- Run: ${runUrl}`,
              `- Target: ${process.env.PRODUCTION_URL}`,
              `- Trigger: ${context.eventName}`,
              '',
              'Triage with docs/ALERTS.md (severity model) and',
              'docs/DEPLOYMENT_RUNBOOK.md / docs/ROLLBACK.md (recovery).',
              '',
              '```json',
              summary || '(no smoke output captured)',
              '```',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Production verification failed',
                labels: [label],
                body,
              });
            }

      - name: Close the failure issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'production-smoke';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Production verification recovered — closing. Run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
