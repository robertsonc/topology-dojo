name: CI

# PR gate + reusable check set. No `push: main` trigger: since proposal 0007
# release.yml runs these same jobs (via workflow_call) on every merge SHA it
# releases, so a second standalone run on push would only duplicate them.
# Branch protection requires `CI / check` and `CI / e2e` on pull requests.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to check out. Deploy
          workflows pass the exact resolved SHA they are about to deploy so
          the checks that gate the deploy run against that same commit.
          Defaults to the ref/SHA that triggered this workflow run.
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wrangler env isolation check
        run: node scripts/check-wrangler-env.mjs
      - name: Type-check
        run: npm run typecheck
      # Hardware catalog (hw-catalog): the Python tools are the executable
      # spec. Run them on the same data and fixtures as the TypeScript port,
      # and fail if the shared parity golden or the published bundle drifts.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog reference tools (Python)
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.23.0
          python3 -I -B catalog/tools/check_seed.py --catalog catalog/data --schema catalog/schema/catalog.schema.json
          python3 -I -B catalog/tools/ref_validate.py --catalog catalog/data --fixtures catalog/fixtures/wiring
          python3 -I -B catalog/tools/resolve_probe.py --catalog catalog/data --check catalog/fixtures/resolve/golden.json
      - name: Catalog bundle + generated types are current
        run: npm run catalog:check
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # Browser-level release gate (#216): a small Playwright suite over the
  # critical designer flows + visual baselines. Kept separate from `check`
  # so unit/type failures surface fast without waiting on a browser install.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Visio export through a real reader (hw-catalog Phase 5): LibreOffice
  # headless (libvisio) converts the wire-sheet .vsdx to PDF; page count,
  # size and a low-DPI golden are checked. REQUIRE_LIBREOFFICE makes a
  # missing reader fail instead of skip. ubuntu-latest (24.04) ships the
  # same LibreOffice 24.2 the golden was made with.
  visio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install LibreOffice Draw + poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-draw poppler-utils
      - name: Visio export in LibreOffice
        env:
          REQUIRE_LIBREOFFICE: '1'
        run: npx vitest run src/export/visio-render.test.ts
