name: Deploy Staging

# Manual staging/UAT deploys of ANY ref (proposal 0004, decision 3 /
# operator checklist O7; proposal 0007 keeps this path). Staging is a single
# mutable release-candidate environment. Since proposal 0007, staging is
# ALSO rehearsed automatically by release.yml on every release (the exact
# candidate is deployed here before production), so a manual dispatch
# during a release contends for the staging Worker: both share the
# `topology-dojo-staging` concurrency group and queue behind each other
# rather than cancelling (whichever lands last owns staging — check the run
# summaries / `GET <staging>/healthz` before trusting a UAT result).
#
# Deliberately NOT restricted to main's history: UAT of a feature branch is
# a legitimate use. Note the staging GitHub Environment's Cloudflare token
# must therefore be staging-scoped (operator action; proposal 0007 risks).
#
# The deploy itself is deploy-worker.yml — the one deploy implementation
# shared with release.yml. See docs/DEPLOYMENT_RUNBOOK.md ("Routine staging
# deployment").
on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Git ref (branch, tag, or commit SHA) to deploy. Defaults to the
          ref this workflow run was dispatched on.
        required: false
        type: string
        default: ''
      # Game-day drill controls (docs/GAME_DAY.md): per-deploy feature-flag
      # overrides, STAGING ONLY. "config" (the default) deploys exactly what
      # wrangler.jsonc says; "true"/"false" pass `--var` overrides so a
      # forward-disable/forward-enable drill needs no commit. deploy-worker's
      # smoke step automatically asserts the matching disabled contract.
      # release.yml deliberately has no such inputs — production flag
      # changes are always a reviewed wrangler.jsonc commit.
      workspace_enabled:
        description: 'WORKSPACE_ENABLED override (game-day drills)'
        required: false
        type: choice
        options: [config, 'true', 'false']
        default: config
      profiles_enabled:
        description: 'PROFILES_ENABLED override (game-day drills)'
        required: false
        type: choice
        options: [config, 'true', 'false']
        default: config
      analytics_enabled:
        description: 'ANALYTICS_ENABLED override (game-day drills)'
        required: false
        type: choice
        options: [config, 'true', 'false']
        default: config

permissions:
  contents: read

# One candidate owns staging at a time (proposal 0004, decision 1). Queue
# (never cancel): with cancel-in-progress this run would also cancel a
# release.yml staging rehearsal in flight, failing that release.
concurrency:
  group: topology-dojo-staging
  cancel-in-progress: false

jobs:
  # Resolves `inputs.ref` (or, if empty, the ref this run was dispatched on)
  # to a concrete commit SHA once, so the exact same commit is what gets
  # checked (via the reusable `check` call below), built, deployed, and
  # smoke-tested — a branch name could otherwise move between those steps.
  # Flag overrides come from closed-set choice inputs and are turned into
  # deploy-worker `extra_vars` tokens here.
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      extra_vars: ${{ steps.overrides.outputs.extra_vars }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: overrides
        env:
          WORKSPACE_OVERRIDE: ${{ inputs.workspace_enabled }}
          PROFILES_OVERRIDE: ${{ inputs.profiles_enabled }}
          ANALYTICS_OVERRIDE: ${{ inputs.analytics_enabled }}
        run: |
          vars=""
          for pair in "WORKSPACE_ENABLED:$WORKSPACE_OVERRIDE" "PROFILES_ENABLED:$PROFILES_OVERRIDE" "ANALYTICS_ENABLED:$ANALYTICS_OVERRIDE"; do
            case "${pair#*:}" in
              true|false) vars="$vars $pair" ;;
            esac
          done
          echo "extra_vars=${vars# }" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve-ref
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}

  deploy:
    needs: [resolve-ref, check]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment_name: staging
      wrangler_env: staging
      sha: ${{ needs.resolve-ref.outputs.sha }}
      smoke_base_url: https://topology-dojo-staging.robertson-corey.workers.dev
      expect_workspace_disabled: false
      extra_vars: ${{ needs.resolve-ref.outputs.extra_vars }}
    secrets: inherit
